name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a run still in progress (two runs replacing the same release page clash).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true   # to publish the APK on the "android-latest" release

jobs:
  build:
    # Build only in the public repo (free Actions minutes); skipped in the private copy.
    if: github.repository == 'mzalmuzakki/GESITS_MID_pub'
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Keep the same debug signing key between builds so new APKs install over old ones.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Optional: sign with your own key stored as repository secrets
      # (GESITS_KEYSTORE_B64 = base64 of a .jks file, GESITS_KEYSTORE_PASSWORD).
      - name: Use own signing key if configured
        env:
          KS_B64: ${{ secrets.GESITS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/own.jks"
            echo "GESITS_KEYSTORE=$RUNNER_TEMP/own.jks" >> "$GITHUB_ENV"
            echo "Signing with own key"
          else
            echo "No GESITS_KEYSTORE_B64 secret: signing with the cached debug key"
          fi

      - name: Build signed APK
        env:
          GESITS_KEYSTORE_PASSWORD: ${{ secrets.GESITS_KEYSTORE_PASSWORD }}
        run: gradle -p android testReleaseUnitTest assembleRelease --no-daemon

      - name: Name and checksum
        id: apk
        run: |
          V=$(awk -F= '/^major=/{m=$2}/^xx=/{x=$2}/^yy=/{y=$2}END{printf "v%d.%02d.%02d", m, x, y}' android/version.properties)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          APK="GesitsMid-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "${{ steps.apk.outputs.file }}" \
            --prerelease --target "${{ github.sha }}" \
            --title "Gesits MID ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Built by GitHub Actions from commit ${{ github.sha }}.
          SHA-256: ${{ steps.apk.outputs.sha }}
          Permissions: Bluetooth, foreground service, notifications. No internet."

  # Screenshots + memory use from an Android 14 emulator, published on the "android-screenshots" release.
  screenshots:
    needs: build
    if: github.repository == 'mzalmuzakki/GESITS_MID_pub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-screenshots --yes --cleanup-tag || true
          gh release create android-screenshots shots/* --prerelease --target "${{ github.sha }}" \
            --title "App screenshots - build ${{ github.run_number }}" \
            --notes "Android 14 emulator, demo data (no bike). memory.txt has the app's RAM use."
