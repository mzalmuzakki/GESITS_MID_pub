name: Android APK

on:
  push:
    # Only main publishes the APK riders download; other branches never replace it.
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Read-only by default; only the publishing job may write releases.
permissions:
  contents: read

# Runs queue instead of cancelling each other, so a publish step is never cut off half-way
# (which could leave no release, or a draft nobody can download).
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    # Build only in the public repo (free Actions minutes) and only from main (also for manual runs).
    if: github.repository == 'mzalmuzakki/GESITS_MID_pub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.file }}
      version: ${{ steps.apk.outputs.version }}
      sha: ${{ steps.apk.outputs.sha }}
      signed: ${{ steps.apk.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      # Keep the same debug signing key between builds so new APKs install over old ones.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Unit tests first, before the signing key is anywhere on the runner.
      - name: Unit tests
        run: gradle -p android testReleaseUnitTest --no-daemon

      # Optional: sign with your own key stored as repository secrets
      # (GESITS_KEYSTORE_B64 = base64 of a .jks file, GESITS_KEYSTORE_PASSWORD).
      - name: Use own signing key if configured
        env:
          KS_B64: ${{ secrets.GESITS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/own.p12"
            echo "GESITS_KEYSTORE=$RUNNER_TEMP/own.p12" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=permanent CAKRA Labs key - installs over earlier permanent-key versions" >> "$GITHUB_ENV"
            echo "Signing with own key"
          else
            echo "SIGNED_WITH=TEST key (no permanent key set up) - may need uninstalling the old app first" >> "$GITHUB_ENV"
            echo "No GESITS_KEYSTORE_B64 secret: signing with a temporary debug key"
          fi

      - name: Build signed APK
        env:
          GESITS_KEYSTORE_PASSWORD: ${{ secrets.GESITS_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/own.p12"

      - name: Name and checksum
        id: apk
        run: |
          V=$(awk -F= '/^major=/{m=$2}/^xx=/{x=$2}/^yy=/{y=$2}END{printf "v%d.%02d.%02d", m, x, y}' android/version.properties)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          APK="GesitsMid-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED_WITH" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

  # Runs the APK in an Android 14 emulator: opens every screen, fails if the app crashes, takes screenshots
  # and measures memory. Only if this passes is the APK published on the "android-latest" release.
  test-and-publish:
    needs: build
    if: github.repository == 'mzalmuzakki/GESITS_MID_pub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: Publish APK to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          # Riders get only APKs signed with the permanent key (a test-key APK would need an uninstall).
          case "$SIGNED" in TEST*) echo "::error::Not signed with the permanent key - not publishing"; exit 1;; esac
          TITLE="Gesits MID ${{ needs.build.outputs.version }} (build ${{ github.run_number }})"
          NOTES="Built by GitHub Actions from commit ${{ github.sha }}. Unit tests passed; every screen was opened in an Android 14 emulator with demo data without a crash or freeze. NOT tested by this build: the Bluetooth connection and the bike. Test on the bike while parked first; if the MID ever freezes, stop safely and switch the bike off and on.
          SHA-256: ${{ needs.build.outputs.sha }}
          Signed with: ${{ needs.build.outputs.signed }}
          Permissions: Bluetooth, foreground service; notifications (optional); location only for 'Remember where I parked' (and, on Android 8-11, to scan for a Bluetooth LE bike); notification access only for directions. No internet."
          if gh release view android-latest >/dev/null 2>&1; then
            # Update in place, so there is never a moment without a downloadable release:
            # upload the new APK first, then move the tag, update the text, and remove older APKs.
            gh release upload android-latest "apk/$APK" --clobber
            git tag -f android-latest "${{ github.sha }}" && git push -f origin refs/tags/android-latest
            gh release edit android-latest --title "$TITLE" --notes "$NOTES" --prerelease --draft=false
            for a in $(gh release view android-latest --json assets --jq '.assets[].name'); do
              [ "$a" = "$APK" ] || gh release delete-asset android-latest "$a" --yes
            done
          else
            gh release create android-latest "apk/$APK" --prerelease --target "${{ github.sha }}" --title "$TITLE" --notes "$NOTES"
          fi
          # gh uploads to a draft and publishes it at the end; once that last step was lost (build 28),
          # leaving a draft nobody could download. Make sure it is published, and check.
          gh release edit android-latest --draft=false --prerelease
          test "$(gh release view android-latest --json isDraft --jq .isDraft)" = "false"

      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-screenshots --yes --cleanup-tag || true
          gh release create android-screenshots shots/* --prerelease --target "${{ github.sha }}" \
            --title "App screenshots - build ${{ github.run_number }}" \
            --notes "Android 14 emulator, demo data (no bike). memory.txt has the app's RAM use."
