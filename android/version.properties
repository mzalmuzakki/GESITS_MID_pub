# App version: v<major>.<xx>.<yy>
#   major - 0 while in development; 1 once tested on the bike and considered stable
#   xx    - feature milestone: something new or changed you would notice (reset yy to 0)
#   yy    - fixes and polish only
# Android's internal versionCode = major*10000 + xx*100 + yy (must only go up).
major=0
xx=14
yy=2
